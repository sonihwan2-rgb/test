<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중등 수학 임용고시 개인 위키</title>
  <!-- KaTeX 수식 렌더링 라이브러리 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f1f5f9;
      --bg-active: #eef2ff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --callout-bg: #f8fafc;
      --callout-border: #4f46e5;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    body.dark {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --bg-active: #312e81;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-color: #334155;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --callout-bg: #0f172a;
      --callout-border: #6366f1;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
      line-height: 1.65;
    }

    /* 사이드바 */
    .sidebar {
      width: 320px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
    }

    .auth-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;
      font-size: 0.78rem;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-right: 6px;
    }

    .status-dot.online { background: var(--success); }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

    .btn-primary {
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover { background-color: var(--accent-hover); }

    .search-box {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input, .select-filter {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-main);
      color: var(--text-primary);
      font-size: 0.84rem;
      outline: none;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .doc-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }

    .doc-item:hover { background-color: var(--bg-hover); }
    .doc-item.active { background-color: var(--bg-active); border-color: var(--accent); }

    .doc-item-cat {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .doc-item-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-item-meta {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .sidebar-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .sidebar-footer .full-span { grid-column: span 2; }

    /* 메인 영역 */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 54px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .mobile-menu-btn { display: none; margin-right: 10px; }

    .breadcrumb {
      font-size: 0.84rem;
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 55vw;
    }

    .action-group { display: flex; gap: 6px; align-items: center; }

    .sync-badge {
      font-size: 0.76rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--bg-main);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary {
      background: var(--bg-main);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.81rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-secondary:hover { background: var(--bg-hover); }

    .btn-accent-outline {
      background: var(--bg-active);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.81rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-accent-outline:hover { background: var(--accent); color: #ffffff; }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.81rem;
      cursor: pointer;
    }

    .btn-danger:hover { background: var(--danger); color: #fff; }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
    }

    .wiki-card {
      max-width: 860px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 36px 40px;
      box-shadow: var(--shadow);
    }

    .badge-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

    .badge {
      display: inline-block;
      background: var(--bg-active);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .badge-sub {
      background: var(--bg-main);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .article-title {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .article-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tag-chip {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.76rem;
    }

    .article-body { font-size: 1rem; color: var(--text-primary); }
    .article-body h2 {
      font-size: 1.32rem;
      margin: 24px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }
    .article-body h3 { font-size: 1.1rem; margin: 18px 0 8px; color: var(--accent); }
    .article-body p { margin-bottom: 12px; }
    .article-body ul { margin: 8px 0 14px 22px; }
    .article-body li { margin-bottom: 5px; }

    .callout {
      background: var(--callout-bg);
      border-left: 4px solid var(--callout-border);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 16px 0;
    }

    .attached-images {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px dashed var(--border-color);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .attached-img-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-main);
    }

    .attached-img-box img { width: 100%; display: block; cursor: zoom-in; }
    .attached-img-caption {
      padding: 6px 10px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 에디터 스타일 */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }
    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      padding: 8px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .tool-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tool-btn:hover { border-color: var(--accent); color: var(--accent); }

    .form-textarea {
      min-height: 340px;
      resize: vertical;
      line-height: 1.6;
      font-family: "Consolas", "Pretendard", monospace;
    }

    .preview-box {
      margin-top: 12px;
      padding: 16px;
      border: 1px dashed var(--accent);
      border-radius: 8px;
      background: var(--bg-main);
      display: none;
    }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

    /* 모달 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .modal img { max-width: 95%; max-height: 92vh; border-radius: 8px; }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0; bottom: 0; left: 0;
        z-index: 50;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: inline-block; }
      .wiki-card { padding: 22px 18px; }
      .form-row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 좌측 사이드바 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <div class="brand-title">∑ 수학 임용 위키</div>
        <button class="icon-btn" id="themeToggle" title="다크모드 전환">🌓 테마</button>
      </div>

      <!-- GitHub 로그인 상태 표시 바 -->
      <div class="auth-bar">
        <div>
          <span class="status-dot" id="authDot"></span>
          <span id="authStatusText">읽기 전용 (미연동)</span>
        </div>
        <button class="icon-btn" id="openAuthModalBtn">🔑 GitHub 설정</button>
      </div>

      <button class="btn-primary" id="newDocBtn">+ 새 정리 문서 작성</button>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="제목, 본문, 태그 검색..." />
      <div class="filter-grid">
        <select class="select-filter" id="categoryFilter">
          <option value="ALL">전체 과목</option>
          <option value="해석학">해석학</option>
          <option value="현대대수학">현대대수학</option>
          <option value="선형대수학">선형대수학</option>
          <option value="위상수학">위상수학</option>
          <option value="미분기하학">미분기하학</option>
          <option value="정수론">정수론</option>
          <option value="이산수학">이산수학</option>
          <option value="확률및통계">확률 및 통계</option>
          <option value="복소해석학">복소해석학</option>
          <option value="수학교육론">수학교육론</option>
          <option value="기출분석">기출문제 분석</option>
        </select>
        <select class="select-filter" id="subCategoryFilter">
          <option value="ALL">전체 세부단원</option>
        </select>
      </div>
    </div>

    <div class="doc-list" id="docList"></div>

    <div class="sidebar-footer">
      <button class="btn-accent-outline" id="mergeBtn" title="기존 문서를 유지하고 새 JSON 문서를 이어 붙입니다">➕ JSON 추가(병합)</button>
      <button class="btn-secondary" id="syncPullBtn" title="GitHub 저장소에서 최신 데이터를 다시 불러옵니다">🔄 GitHub 새로고침</button>
      <button class="btn-secondary" id="importBtn" title="기존 문서를 지우고 백업 파일로 덮어씁니다">📂 전체 복원</button>
      <button class="btn-secondary" id="exportBtn" title="현재 위키 전체를 JSON 파일로 백업">💾 백업 저장</button>
      <input type="file" id="mergeFileInput" accept=".json" style="display:none" />
      <input type="file" id="importFileInput" accept=".json" style="display:none" />
    </div>
  </aside>

  <!-- 우측 메인 화면 -->
  <main class="main-container">
    <header class="topbar">
      <div style="display:flex; align-items:center;">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn">☰ 목록</button>
        <span class="breadcrumb" id="breadcrumb">문서 보기</span>
      </div>
      <div class="action-group">
        <span class="sync-badge" id="syncBadge">로컬 모드</span>
        <div id="viewActions" style="display:flex; gap:6px;">
          <button class="btn-secondary" id="splitDocBtn" title="이 문서를 복제해 세부 주제로 분할 작성합니다">📑 복제(세분화)</button>
          <button class="btn-secondary" id="editDocBtn">✏️ 수정</button>
          <button class="btn-danger" id="deleteDocBtn">🗑️ 삭제</button>
        </div>
      </div>
    </header>

    <div class="content-scroll" id="contentScroll">
      <!-- 문서 열람 뷰 -->
      <article class="wiki-card" id="viewContainer"></article>

      <!-- 문서 작성/수정 뷰 -->
      <section class="wiki-card" id="editContainer" style="display:none;">
        <div class="form-group">
          <label class="form-label">문서 제목</label>
          <input type="text" class="form-input" id="editTitle" placeholder="예: [해석학] 바이어슈트라스 M-판정법과 적용" />
        </div>

        <div class="form-row-3 form-group">
          <div>
            <label class="form-label">과목 (대분류)</label>
            <select class="form-select" id="editCategory">
              <option value="해석학">해석학</option>
              <option value="현대대수학">현대대수학</option>
              <option value="선형대수학">선형대수학</option>
              <option value="위상수학">위상수학</option>
              <option value="미분기하학">미분기하학</option>
              <option value="정수론">정수론</option>
              <option value="이산수학">이산수학</option>
              <option value="확률및통계">확률 및 통계</option>
              <option value="복소해석학">복소해석학</option>
              <option value="수학교육론">수학교육론</option>
              <option value="기출분석">기출문제 분석</option>
            </select>
          </div>
          <div>
            <label class="form-label">세부 단원 (중분류 · 세분화용)</label>
            <input type="text" class="form-input" id="editSubCategory" list="subCatSuggestions" placeholder="예: 함수열과 급수 / 갈루아 이론" />
            <datalist id="subCatSuggestions"></datalist>
          </div>
          <div>
            <label class="form-label">태그 (쉼표로 구분)</label>
            <input type="text" class="form-input" id="editTags" placeholder="예: 1순위, 평등수렴, 2026기출" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">본문 내용 (간단 문법 및 LaTeX 수식 $...$, $$...$$ 지원)</label>
          <div class="editor-toolbar">
            <button type="button" class="tool-btn" data-insert="## 소제목&#10;">H2 소제목</button>
            <button type="button" class="tool-btn" data-insert="### 핵심 정리&#10;">H3 정리제목</button>
            <button type="button" class="tool-btn" data-insert="**강조텍스트**">굵게</button>
            <button type="button" class="tool-btn" data-insert="> [정리] ">정리 박스</button>
            <button type="button" class="tool-btn" data-insert="$f(x) = x^2$">인라인 수식 $</button>
            <button type="button" class="tool-btn" data-insert="&#10;$$&#10;\lim_{n \to \infty} a_n = L&#10;$$&#10;">블록 수식 $$</button>
            <button type="button" class="tool-btn" id="uploadImgBtn">🖼️ 이미지 첨부</button>
            <button type="button" class="tool-btn" id="togglePreviewBtn">👁️ 미리보기</button>
            <input type="file" id="imgInput" accept="image/*" multiple style="display:none" />
          </div>
          <textarea class="form-textarea" id="editBody"></textarea>
          <div class="preview-box article-body" id="livePreview"></div>
        </div>

        <div class="attached-images" id="editImagesList" style="margin-bottom:20px;"></div>

        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button type="button" class="btn-secondary" id="cancelEditBtn">취소</button>
          <button type="button" class="btn-primary" id="saveDocBtn" style="width:auto; padding:9px 24px;">저장 및 GitHub 동기화</button>
        </div>
      </section>
    </div>
  </main>

  <!-- GitHub 로그인/연동 모달 -->
  <div class="modal" id="authModal">
    <div class="modal-card">
      <h3 style="margin-bottom:8px; font-size:1.15rem;">🔑 GitHub 저장소 로그인 연동</h3>
      <p style="font-size:0.82rem; color:var(--text-secondary); margin-bottom:16px;">
        Fine-grained Personal Access Token을 입력하면 문서 작성·수정·세분화 시 저장소의 <strong>wiki_data.json</strong>에 자동으로 커밋됩니다.
      </p>
      <div class="form-group">
        <label class="form-label">GitHub 사용자명 (Owner)</label>
        <input type="text" class="form-input" id="ghOwner" placeholder="예: sonihwan" />
      </div>
      <div class="form-group">
        <label class="form-label">저장소 이름 (Repository)</label>
        <input type="text" class="form-input" id="ghRepo" placeholder="예: math-imyong-wiki" />
      </div>
      <div class="form-group">
        <label class="form-label">데이터 파일 경로 (기본값: wiki_data.json)</label>
        <input type="text" class="form-input" id="ghPath" value="wiki_data.json" />
      </div>
      <div class="form-group">
        <label class="form-label">Personal Access Token (Contents: Read & Write 권한)</label>
        <input type="password" class="form-input" id="ghToken" placeholder="github_pat_..." />
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:18px;">
        <button type="button" class="btn-danger" id="ghLogoutBtn">연동 해제(로그아웃)</button>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn-secondary" id="closeAuthModalBtn">닫기</button>
          <button type="button" class="btn-primary" id="ghSaveConfigBtn" style="width:auto; padding:8px 18px;">로그인 및 연결</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 이미지 확대 모달 -->
  <div class="modal" id="imgModal">
    <img id="modalImg" src="" alt="확대 이미지" />
  </div>

  <script>
    const STORAGE_KEY = "math_imyong_wiki_docs_v1";
    const GH_CONFIG_KEY = "math_imyong_wiki_gh_config_v1";

    let docs = [];
    let currentDocId = null;
    let editingDocId = null;
    let tempImages = [];
    let ghConfig = null; // { owner, repo, path, token }

    const docListEl = document.getElementById("docList");
    const searchInputEl = document.getElementById("searchInput");
    const categoryFilterEl = document.getElementById("categoryFilter");
    const subCategoryFilterEl = document.getElementById("subCategoryFilter");
    const viewContainerEl = document.getElementById("viewContainer");
    const editContainerEl = document.getElementById("editContainer");
    const viewActionsEl = document.getElementById("viewActions");
    const breadcrumbEl = document.getElementById("breadcrumb");
    const syncBadgeEl = document.getElementById("syncBadge");

    // UTF-8 안전 Base64 변환
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function base64ToUtf8(b64) {
      const clean = b64.replace(/\s/g, "");
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function getSubCategory(doc) {
      if (doc.subCategory && doc.subCategory.trim()) return doc.subCategory.trim();
      if (doc.tags && doc.tags.length > 1) return doc.tags[1];
      return "기본 정리";
    }

    function updateAuthUI() {
      const dot = document.getElementById("authDot");
      const statusText = document.getElementById("authStatusText");
      if (ghConfig && ghConfig.token) {
        dot.classList.add("online");
        statusText.textContent = `${ghConfig.owner}/${ghConfig.repo} 연동됨`;
        syncBadgeEl.textContent = "GitHub 동기화 활성";
      } else {
        dot.classList.remove("online");
        statusText.textContent = "읽기 전용 (미연동)";
        syncBadgeEl.textContent = "로컬/읽기 모드";
      }
    }

    // GitHub에서 최신 wiki_data.json 불러오기
    async function loadFromGitHub(silent = false) {
      try {
        syncBadgeEl.textContent = "불러오는 중...";
        if (ghConfig && ghConfig.token) {
          // API로 조회 (CDN 캐시 없이 즉시 최신 커밋 반영 + Private 저장소 지원)
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const res = await fetch(url, {
            headers: {
              "Authorization": `Bearer ${ghConfig.token}`,
              "Accept": "application/vnd.github+json"
            },
            cache: "no-store"
          });
          if (res.ok) {
            const data = await res.json();
            const parsed = JSON.parse(base64ToUtf8(data.content));
            if (Array.isArray(parsed)) {
              docs = parsed;
              saveToLocalStorage();
              syncBadgeEl.textContent = "GitHub 최신 동기화 완료";
              return true;
            }
          } else if (res.status === 404) {
            syncBadgeEl.textContent = "저장소 파일 신규 생성 대기";
            return false;
          }
        } else {
          // 미로그인(방문자) 상태: 같은 경로의 정적 wiki_data.json 조회
          const res = await fetch(`./wiki_data.json?t=${Date.now()}`);
          if (res.ok) {
            const parsed = await res.json();
            if (Array.isArray(parsed) && parsed.length > 0) {
              docs = parsed;
              saveToLocalStorage();
              syncBadgeEl.textContent = "웹 데이터 로드됨 (읽기전용)";
              return true;
            }
          }
        }
      } catch (err) {
        console.warn("GitHub fetch skipped or failed:", err);
      }
      updateAuthUI();
      return false;
    }

    // GitHub 저장소에 wiki_data.json 자동 커밋
    async function pushToGitHub(commitMsg = "Update wiki_data.json via Web Wiki") {
      if (!ghConfig || !ghConfig.token) return;
      try {
        syncBadgeEl.textContent = "GitHub 저장 중...";
        const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
        const headers = {
          "Authorization": `Bearer ${ghConfig.token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        };

        // 최신 파일 SHA 조회
        let sha = null;
        const getRes = await fetch(url, { headers, cache: "no-store" });
        if (getRes.ok) {
          const existing = await getRes.json();
          sha = existing.sha;
        }

        const bodyPayload = {
          message: commitMsg,
          content: utf8ToBase64(JSON.stringify(docs, null, 2))
        };
        if (sha) bodyPayload.sha = sha;

        const putRes = await fetch(url, {
          method: "PUT",
          headers,
          body: JSON.stringify(bodyPayload)
        });

        if (putRes.ok) {
          syncBadgeEl.textContent = "✓ GitHub 저장 완료";
        } else {
          const errData = await putRes.json();
          alert(`GitHub 저장 실패: ${errData.message}`);
          syncBadgeEl.textContent = "⚠️ GitHub 저장 오류";
        }
      } catch (e) {
        alert("네트워크 오류로 GitHub 동기화에 실패했습니다. 로컬에는 저장되었습니다.");
        syncBadgeEl.textContent = "⚠️ 오프라인(로컬저장됨)";
      }
    }

    async function init() {
      const savedConfig = localStorage.getItem(GH_CONFIG_KEY);
      if (savedConfig) {
        try { ghConfig = JSON.parse(savedConfig); } catch (e) {}
      }
      updateAuthUI();

      const savedDocs = localStorage.getItem(STORAGE_KEY);
      if (savedDocs) {
        try { docs = JSON.parse(savedDocs); } catch (e) { docs = []; }
      }

      // 원격(GitHub)에서 최신 데이터 확인
      await loadFromGitHub(true);

      if (localStorage.getItem("wiki_theme") === "dark") {
        document.body.classList.add("dark");
      }

      if (docs.length > 0 && !currentDocId) {
        currentDocId = docs[0].id;
      }
      refreshSubCategoryOptions();
      renderSidebar();
      renderView();
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
      } catch (e) {
        alert("브라우저 로컬 저장소 용량이 부족합니다.");
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatContent(rawText) {
      if (!rawText) return "";
      const mathBlocks = [];

      let text = rawText.replace(/\$\$([\s\S]*?)\$\$/g, (match) => {
        mathBlocks.push(match);
        return `@@MATH_${mathBlocks.length - 1}@@`;
      });

      text = text.replace(/\$([^\$\n]+?)\$/g, (match) => {
        mathBlocks.push(match);
        return `@@MATH_${mathBlocks.length - 1}@@`;
      });

      text = escapeHtml(text);

      const lines = text.split("\n");
      let html = "";
      let inList = false;

      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith("- ")) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${applyInlineFormat(trimmed.slice(2))}</li>`;
          continue;
        } else if (inList) {
          html += "</ul>";
          inList = false;
        }

        if (trimmed.startsWith("### ")) {
          html += `<h3>${applyInlineFormat(trimmed.slice(4))}</h3>`;
        } else if (trimmed.startsWith("## ")) {
          html += `<h2>${applyInlineFormat(trimmed.slice(3))}</h2>`;
        } else if (trimmed.startsWith("&gt; ")) {
          html += `<div class="callout">${applyInlineFormat(trimmed.slice(5))}</div>`;
        } else if (trimmed === "") {
          html += "<div style='height:8px;'></div>";
        } else {
          html += `<p>${applyInlineFormat(line)}</p>`;
        }
      }

      if (inList) html += "</ul>";
      return html.replace(/@@MATH_(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);
    }

    function applyInlineFormat(str) {
      return str.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function renderMath(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    // 세부 단원(중분류) 드롭다운 동적 갱신
    function refreshSubCategoryOptions() {
      const selectedCat = categoryFilterEl.value;
      const prevSub = subCategoryFilterEl.value;
      const subSet = new Set();

      docs.forEach((d) => {
        if (selectedCat === "ALL" || d.category === selectedCat) {
          subSet.add(getSubCategory(d));
        }
      });

      subCategoryFilterEl.innerHTML = `<option value="ALL">전체 세부단원</option>`;
      const datalist = document.getElementById("subCatSuggestions");
      datalist.innerHTML = "";

      Array.from(subSet).sort().forEach((sub) => {
        const opt = document.createElement("option");
        opt.value = sub;
        opt.textContent = sub;
        subCategoryFilterEl.appendChild(opt);

        const dOpt = document.createElement("option");
        dOpt.value = sub;
        datalist.appendChild(dOpt);
      });

      if (Array.from(subSet).includes(prevSub)) {
        subCategoryFilterEl.value = prevSub;
      } else {
        subCategoryFilterEl.value = "ALL";
      }
    }

    function renderSidebar() {
      const keyword = searchInputEl.value.trim().toLowerCase();
      const cat = categoryFilterEl.value;
      const subCat = subCategoryFilterEl.value;

      const filtered = docs.filter((doc) => {
        const docSub = getSubCategory(doc);
        const matchCat = cat === "ALL" || doc.category === cat;
        const matchSub = subCat === "ALL" || docSub === subCat;
        const matchKey =
          !keyword ||
          doc.title.toLowerCase().includes(keyword) ||
          doc.content.toLowerCase().includes(keyword) ||
          docSub.toLowerCase().includes(keyword) ||
          (doc.tags && doc.tags.some((t) => t.toLowerCase().includes(keyword)));
        return matchCat && matchSub && matchKey;
      });

      docListEl.innerHTML = "";
      if (filtered.length === 0) {
        docListEl.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.84rem;">일치하는 문서가 없습니다.</div>`;
        return;
      }

      filtered.forEach((doc) => {
        const item = document.createElement("div");
        item.className = "doc-item" + (doc.id === currentDocId ? " active" : "");
        item.innerHTML = `
          <div class="doc-item-cat">${escapeHtml(doc.category)} · ${escapeHtml(getSubCategory(doc))}</div>
          <div class="doc-item-title">${escapeHtml(doc.title)}</div>
          <div class="doc-item-meta">${escapeHtml(doc.updatedAt || "")}</div>
        `;
        item.onclick = () => {
          currentDocId = doc.id;
          switchToView();
          renderSidebar();
          renderView();
          document.getElementById("sidebar").classList.remove("open");
        };
        docListEl.appendChild(item);
      });
    }

    function renderView() {
      const doc = docs.find((d) => d.id === currentDocId);
      if (!doc) {
        viewActionsEl.style.display = "none";
        breadcrumbEl.textContent = "문서 없음";
        viewContainerEl.innerHTML = `
          <div class="empty-state">
            <h3>등록된 문서가 없습니다</h3>
            <p style="margin-top:8px;">좌측 하단의 <strong>[➕ JSON 추가(병합)]</strong>으로 정리 파일을 올리거나 <strong>[+ 새 정리 문서 작성]</strong>을 눌러보세요.</p>
          </div>
        `;
        return;
      }

      viewActionsEl.style.display = "flex";
      const subCat = getSubCategory(doc);
      breadcrumbEl.textContent = `${doc.category} > ${subCat} > ${doc.title}`;

      const tagsHtml = (doc.tags || [])
        .map((t) => `<span class="tag-chip">#${escapeHtml(t)}</span>`)
        .join("");

      let imagesHtml = "";
      if (doc.images && doc.images.length > 0) {
        imagesHtml = `<div class="attached-images">` +
          doc.images.map((img, idx) => `
            <div class="attached-img-box">
              <img src="${img.data}" alt="${escapeHtml(img.name || '첨부이미지')}" onclick="openModal('${img.data}')" />
              <div class="attached-img-caption"><span>${escapeHtml(img.name || '참고 이미지 ' + (idx + 1))}</span></div>
            </div>
          `).join("") +
        `</div>`;
      }

      viewContainerEl.innerHTML = `
        <div class="badge-row">
          <span class="badge">${escapeHtml(doc.category)}</span>
          <span class="badge badge-sub">${escapeHtml(subCat)}</span>
        </div>
        <h1 class="article-title">${escapeHtml(doc.title)}</h1>
        <div class="article-meta">
          <span>최종 수정: ${escapeHtml(doc.updatedAt || "")}</span>
          ${tagsHtml}
        </div>
        <div class="article-body" id="renderedBody">${formatContent(doc.content)}</div>
        ${imagesHtml}
      `;

      renderMath(document.getElementById("renderedBody"));
    }

    function switchToView() {
      editContainerEl.style.display = "none";
      viewContainerEl.style.display = "block";
    }

    function switchToEdit(doc = null, isDuplicate = false) {
      viewContainerEl.style.display = "none";
      viewActionsEl.style.display = "none";
      editContainerEl.style.display = "block";
      document.getElementById("livePreview").style.display = "none";

      if (doc && !isDuplicate) {
        editingDocId = doc.id;
        breadcrumbEl.textContent = `수정 중: ${doc.title}`;
        document.getElementById("editTitle").value = doc.title;
        document.getElementById("editCategory").value = doc.category;
        document.getElementById("editSubCategory").value = getSubCategory(doc);
        document.getElementById("editTags").value = (doc.tags || []).join(", ");
        document.getElementById("editBody").value = doc.content;
        tempImages = doc.images ? [...doc.images] : [];
      } else if (doc && isDuplicate) {
        editingDocId = null;
        breadcrumbEl.textContent = `세부 문서 분할 작성`;
        document.getElementById("editTitle").value = doc.title + " (세부 정리)";
        document.getElementById("editCategory").value = doc.category;
        document.getElementById("editSubCategory").value = getSubCategory(doc);
        document.getElementById("editTags").value = (doc.tags || []).join(", ");
        document.getElementById("editBody").value = doc.content;
        tempImages = doc.images ? [...doc.images] : [];
      } else {
        editingDocId = null;
        breadcrumbEl.textContent = "새 정리 문서 작성";
        document.getElementById("editTitle").value = "";
        document.getElementById("editCategory").value = categoryFilterEl.value !== "ALL" ? categoryFilterEl.value : "해석학";
        document.getElementById("editSubCategory").value = "";
        document.getElementById("editTags").value = "";
        document.getElementById("editBody").value = "";
        tempImages = [];
      }
      renderEditImages();
    }

    function renderEditImages() {
      const container = document.getElementById("editImagesList");
      if (tempImages.length === 0) { container.innerHTML = ""; return; }
      container.innerHTML = tempImages.map((img, idx) => `
        <div class="attached-img-box">
          <img src="${img.data}" alt="미리보기" />
          <div class="attached-img-caption">
            <span>${escapeHtml(img.name)}</span>
            <button type="button" class="btn-danger" style="padding:2px 6px; font-size:0.72rem;" onclick="removeTempImage(${idx})">삭제</button>
          </div>
        </div>
      `).join("");
    }

    window.removeTempImage = function(idx) { tempImages.splice(idx, 1); renderEditImages(); };
    window.openModal = function(src) {
      document.getElementById("modalImg").src = src;
      document.getElementById("imgModal").style.display = "flex";
    };
    document.getElementById("imgModal").onclick = function() { this.style.display = "none"; };

    function getNowString() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    // 버튼 이벤트
    document.getElementById("newDocBtn").onclick = () => {
      switchToEdit(null);
      document.getElementById("sidebar").classList.remove("open");
    };

    document.getElementById("editDocBtn").onclick = () => {
      const doc = docs.find((d) => d.id === currentDocId);
      if (doc) switchToEdit(doc, false);
    };

    document.getElementById("splitDocBtn").onclick = () => {
      const doc = docs.find((d) => d.id === currentDocId);
      if (doc) switchToEdit(doc, true);
    };

    document.getElementById("deleteDocBtn").onclick = async () => {
      const doc = docs.find((d) => d.id === currentDocId);
      if (!doc) return;
      if (confirm(`'${doc.title}' 문서를 정말 삭제하시겠습니까?`)) {
        docs = docs.filter((d) => d.id !== currentDocId);
        saveToLocalStorage();
        currentDocId = docs.length > 0 ? docs[0].id : null;
        refreshSubCategoryOptions();
        renderSidebar();
        renderView();
        await pushToGitHub(`Delete doc: ${doc.title}`);
      }
    };

    document.getElementById("cancelEditBtn").onclick = () => { switchToView(); renderView(); };

    document.getElementById("saveDocBtn").onclick = async () => {
      const title = document.getElementById("editTitle").value.trim();
      const category = document.getElementById("editCategory").value;
      const subCategory = document.getElementById("editSubCategory").value.trim() || "기본 정리";
      const tagsRaw = document.getElementById("editTags").value;
      const content = document.getElementById("editBody").value;

      if (!title) { alert("문서 제목을 입력해 주세요."); return; }

      const tags = tagsRaw.split(",").map((t) => t.trim()).filter((t) => t.length > 0);

      if (editingDocId) {
        const idx = docs.findIndex((d) => d.id === editingDocId);
        if (idx !== -1) {
          docs[idx] = { ...docs[idx], title, category, subCategory, tags, content, images: tempImages, updatedAt: getNowString() };
          currentDocId = editingDocId;
        }
      } else {
        const newDoc = {
          id: "doc-" + Date.now(),
          title, category, subCategory, tags, content,
          images: tempImages,
          updatedAt: getNowString()
        };
        docs.unshift(newDoc);
        currentDocId = newDoc.id;
      }

      saveToLocalStorage();
      switchToView();
      refreshSubCategoryOptions();
      renderSidebar();
      renderView();
      await pushToGitHub(`Save doc: ${title}`);
    };

    // GitHub 설정 모달 이벤트
    const authModal = document.getElementById("authModal");
    document.getElementById("openAuthModalBtn").onclick = () => {
      if (ghConfig) {
        document.getElementById("ghOwner").value = ghConfig.owner || "";
        document.getElementById("ghRepo").value = ghConfig.repo || "";
        document.getElementById("ghPath").value = ghConfig.path || "wiki_data.json";
        document.getElementById("ghToken").value = ghConfig.token || "";
      }
      authModal.style.display = "flex";
    };

    document.getElementById("closeAuthModalBtn").onclick = () => { authModal.style.display = "none"; };

    document.getElementById("ghSaveConfigBtn").onclick = async () => {
      const owner = document.getElementById("ghOwner").value.trim();
      const repo = document.getElementById("ghRepo").value.trim();
      const path = document.getElementById("ghPath").value.trim() || "wiki_data.json";
      const token = document.getElementById("ghToken").value.trim();

      if (!owner || !repo || !token) {
        alert("사용자명, 저장소 이름, 토큰을 모두 입력해 주세요.");
        return;
      }

      ghConfig = { owner, repo, path, token };
      localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(ghConfig));
      updateAuthUI();
      authModal.style.display = "none";

      const loaded = await loadFromGitHub();
      if (!loaded && docs.length > 0) {
        // 원격에 파일이 아직 없으면 현재 로컬 문서를 원격에 최초 업로드
        await pushToGitHub("Initialize wiki_data.json");
      }
      if (docs.length > 0) currentDocId = docs[0].id;
      refreshSubCategoryOptions();
      renderSidebar();
      renderView();
    };

    document.getElementById("ghLogoutBtn").onclick = () => {
      ghConfig = null;
      localStorage.removeItem(GH_CONFIG_KEY);
      document.getElementById("ghToken").value = "";
      updateAuthUI();
      authModal.style.display = "none";
      alert("GitHub 연동이 해제되었습니다. (읽기 전용 모드로 전환)");
    };

    document.getElementById("syncPullBtn").onclick = async () => {
      const ok = await loadFromGitHub();
      if (ok) {
        if (docs.length > 0 && !docs.some(d => d.id === currentDocId)) currentDocId = docs[0].id;
        refreshSubCategoryOptions();
        renderSidebar();
        renderView();
      } else {
        alert("GitHub에서 불러올 wiki_data.json을 찾지 못했습니다.");
      }
    };

    // 툴바 및 이미지 첨부
    document.querySelectorAll(".tool-btn[data-insert]").forEach((btn) => {
      btn.onclick = () => {
        const textarea = document.getElementById("editBody");
        const insertText = btn.getAttribute("data-insert");
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + insertText + textarea.value.substring(end);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + insertText.length;
      };
    });

    document.getElementById("togglePreviewBtn").onclick = () => {
      const preview = document.getElementById("livePreview");
      if (preview.style.display === "block") {
        preview.style.display = "none";
      } else {
        preview.style.display = "block";
        preview.innerHTML = formatContent(document.getElementById("editBody").value);
        renderMath(preview);
      }
    };

    document.getElementById("uploadImgBtn").onclick = () => document.getElementById("imgInput").click();

    document.getElementById("imgInput").onchange = (e) => {
      Array.from(e.target.files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 900;
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            tempImages.push({ name: file.name, data: canvas.toDataURL("image/jpeg", 0.78) });
            renderEditImages();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      e.target.value = "";
    };

    // 필터 및 검색
    searchInputEl.oninput = renderSidebar;
    categoryFilterEl.onchange = () => { refreshSubCategoryOptions(); renderSidebar(); };
    subCategoryFilterEl.onchange = renderSidebar;

    document.getElementById("themeToggle").onclick = () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("wiki_theme", document.body.classList.contains("dark") ? "dark" : "light");
    };

    document.getElementById("mobileMenuBtn").onclick = () => {
      document.getElementById("sidebar").classList.toggle("open");
    };

    // JSON 백업 / 병합 / 복원 (병합·복원 시에도 GitHub 자동 커밋)
    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(docs, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `수학임용위키_통합백업_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById("mergeBtn").onclick = () => document.getElementById("mergeFileInput").click();
    document.getElementById("mergeFileInput").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error();
          let added = 0, updated = 0;
          imported.forEach((newDoc) => {
            if (!newDoc.id) newDoc.id = "doc-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
            const idx = docs.findIndex((d) => d.id === newDoc.id);
            if (idx !== -1) { docs[idx] = newDoc; updated++; }
            else { docs.push(newDoc); added++; }
          });
          saveToLocalStorage();
          if (imported.length > 0) currentDocId = imported[0].id;
          switchToView();
          refreshSubCategoryOptions();
          renderSidebar();
          renderView();
          await pushToGitHub(`Merge ${added} added, ${updated} updated docs`);
          alert(`병합 완료! (신규 추가: ${added}개, 기존 갱신: ${updated}개)`);
        } catch (err) { alert("올바른 위키 JSON 파일이 아닙니다."); }
      };
      reader.readAsText(file);
      e.target.value = "";
    };

    document.getElementById("importBtn").onclick = () => document.getElementById("importFileInput").click();
    document.getElementById("importFileInput").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error();
          if (confirm(`총 ${imported.length}개 문서로 전체 덮어씁니다. 계속하시겠습니까?`)) {
            docs = imported;
            saveToLocalStorage();
            currentDocId = docs.length > 0 ? docs[0].id : null;
            switchToView();
            refreshSubCategoryOptions();
            renderSidebar();
            renderView();
            await pushToGitHub(`Restore full backup (${docs.length} docs)`);
          }
        } catch (err) { alert("올바른 위키 백업 JSON 파일이 아닙니다."); }
      };
      reader.readAsText(file);
      e.target.value = "";
    };

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
