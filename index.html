<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="수학임용위키" />
  <title>중등 수학 임용고시 개인 위키</title>
  <!-- KaTeX 수식 렌더링 라이브러리 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-canvas: #eef2f9;
      --glass-surface: rgba(255, 255, 255, 0.64);
      --glass-surface-strong: rgba(255, 255, 255, 0.80);
      --glass-elevated: rgba(255, 255, 255, 0.54);
      --glass-hover: rgba(255, 255, 255, 0.88);
      --glass-active: rgba(0, 122, 255, 0.13);
      --glass-border: rgba(255, 255, 255, 0.74);
      --glass-border-subtle: rgba(15, 23, 42, 0.08);
      --glass-specular: inset 0 1px 1px rgba(255, 255, 255, 0.92), inset 0 -1px 1px rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 12px 36px rgba(15, 23, 42, 0.07), 0 2px 8px rgba(15, 23, 42, 0.04);

      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #8e8e93;

      --accent: #007aff;
      --accent-hover: #0062cc;
      --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
      --success: #34c759;
      --danger: #ff3b30;

      --callout-bg: rgba(0, 122, 255, 0.07);
      --callout-border: #007aff;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      /* 아이폰 감성 물리 스프링 베지어 곡선 */
      --ios-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --ios-bounce: cubic-bezier(0.34, 1.36, 0.64, 1);
    }

    body.dark {
      --bg-canvas: #070b14;
      --glass-surface: rgba(28, 32, 46, 0.64);
      --glass-surface-strong: rgba(34, 39, 56, 0.82);
      --glass-elevated: rgba(255, 255, 255, 0.06);
      --glass-hover: rgba(255, 255, 255, 0.12);
      --glass-active: rgba(10, 132, 255, 0.22);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-subtle: rgba(255, 255, 255, 0.09);
      --glass-specular: inset 0 1px 1px rgba(255, 255, 255, 0.24), inset 0 -1px 1px rgba(255, 255, 255, 0.04);
      --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 2px 10px rgba(0, 0, 0, 0.3);

      --text-primary: #f5f5f7;
      --text-secondary: #aeaeb2;
      --text-muted: #636366;

      --accent: #0a84ff;
      --accent-hover: #409cff;
      --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
      --success: #30d158;
      --danger: #ff453a;

      --callout-bg: rgba(10, 132, 255, 0.14);
      --callout-border: #0a84ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      line-height: 1.68;
      position: relative;
      letter-spacing: -0.012em;
    }

    /* 앰비언트 배경 오브 */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.65;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 48vw; height: 48vw; max-width: 560px; max-height: 560px;
      background: radial-gradient(circle, rgba(94, 92, 230, 0.35), rgba(0, 122, 255, 0.08));
      top: -12%; left: -8%;
    }
    .orb-2 {
      width: 44vw; height: 44vw; max-width: 520px; max-height: 520px;
      background: radial-gradient(circle, rgba(52, 199, 89, 0.25), rgba(50, 173, 230, 0.12));
      bottom: -14%; right: -6%;
      animation-delay: -6s;
    }
    .orb-3 {
      width: 36vw; height: 36vw; max-width: 420px; max-height: 420px;
      background: radial-gradient(circle, rgba(255, 45, 85, 0.18), rgba(175, 82, 222, 0.08));
      top: 38%; left: 42%;
      animation-delay: -12s;
    }
    body.dark .orb { opacity: 0.48; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(24px, -28px) scale(1.06); }
    }

    button {
      font-family: inherit;
      transition: transform 0.18s var(--ios-spring), background-color 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }
    button:active { transform: scale(0.95); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(142, 142, 147, 0.3); border-radius: 999px; }

    /* 모바일 사이드바 배경 오버레이 */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 28, 0.36);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 45;
      opacity: 0;
      transition: opacity 0.28s var(--ios-spring);
    }
    .sidebar-backdrop.show { display: block; opacity: 1; }

    /* 좌측 플로팅 글라스 사이드바 */
    .sidebar {
      position: relative;
      z-index: 50;
      width: 328px;
      margin: 12px 0 12px 12px;
      border-radius: 28px;
      background: var(--glass-surface-strong);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-specular);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: transform 0.34s var(--ios-spring);
    }

    /* 사이드바 상단 접이식 영역 (로그인 + 새 문서 + 검색) */
    .sidebar-top-collapsible {
      overflow: hidden;
      max-height: 360px;
      opacity: 1;
      transform: translateY(0);
      transition:
        max-height 0.42s var(--ios-spring),
        opacity 0.3s var(--ios-spring),
        transform 0.42s var(--ios-spring);
    }

    .sidebar.chrome-collapsed .sidebar-top-collapsible {
      max-height: 0;
      opacity: 0;
      transform: translateY(-14px);
      pointer-events: none;
    }

    /* 사이드바 축소 시 나타나는 얇은 iOS 상단 캡슐 핸들 */
    .sidebar-top-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 0;
      opacity: 0;
      overflow: hidden;
      cursor: pointer;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-secondary);
      background: var(--glass-elevated);
      border-bottom: 1px solid transparent;
      transition: height 0.36s var(--ios-spring), opacity 0.26s ease, border-color 0.26s ease;
    }

    .sidebar.chrome-collapsed .sidebar-top-pill {
      height: 30px;
      opacity: 1;
      border-bottom-color: var(--glass-border-subtle);
    }

    .pill-grabber {
      width: 32px;
      height: 4px;
      border-radius: 999px;
      background: rgba(142, 142, 147, 0.45);
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--glass-border-subtle);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 1.08rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .auth-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--glass-elevated);
      border: 1px solid var(--glass-border-subtle);
      border-radius: 14px;
      padding: 7px 11px;
      margin-bottom: 10px;
      font-size: 0.78rem;
    }

    .auth-info {
      display: flex;
      align-items: center;
      min-width: 0;
      overflow: hidden;
    }

    .auth-info span:last-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-right: 7px;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52, 199, 89, 0.65);
    }

    .icon-btn {
      background: var(--glass-elevated);
      border: 1px solid var(--glass-border-subtle);
      color: var(--text-primary);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--glass-hover); }

    .btn-primary {
      width: 100%;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 122, 255, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .btn-primary:hover { opacity: 0.94; }

    .search-box {
      padding: 10px 16px 12px;
      border-bottom: 1px solid var(--glass-border-subtle);
    }

    .search-input, .select-filter {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--glass-border-subtle);
      border-radius: 12px;
      background: var(--glass-elevated);
      color: var(--text-primary);
      font-size: 0.84rem;
      outline: none;
    }
    .search-input:focus, .select-filter:focus {
      border-color: var(--accent);
      background: var(--glass-hover);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 8px;
    }

    .doc-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px;
    }

    .doc-item {
      padding: 12px 14px;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 6px;
      border: 1px solid transparent;
      transition: transform 0.16s var(--ios-spring), background-color 0.16s ease, border-color 0.16s ease;
    }
    .doc-item:hover { background-color: var(--glass-hover); }
    .doc-item:active { transform: scale(0.98); }
    .doc-item.active {
      background-color: var(--glass-active);
      border-color: rgba(0, 122, 255, 0.32);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .doc-item-cat { font-size: 0.72rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .doc-item-title {
      font-size: 0.89rem; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .doc-item-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }

    /* 사이드바 하단 접이식 영역 (병합, 새로고침, 복원, 백업) */
    .sidebar-footer-wrap {
      border-top: 1px solid var(--glass-border-subtle);
      background: var(--glass-elevated);
      transition: all 0.38s var(--ios-spring);
    }

    .sidebar-footer {
      padding: 11px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      max-height: 140px;
      opacity: 1;
      transform: translateY(0);
      overflow: hidden;
      transition:
        max-height 0.4s var(--ios-spring),
        padding 0.4s var(--ios-spring),
        opacity 0.28s ease,
        transform 0.4s var(--ios-spring);
    }

    .sidebar.chrome-collapsed .sidebar-footer {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }

    .sidebar-bottom-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 0;
      opacity: 0;
      overflow: hidden;
      cursor: pointer;
      transition: height 0.36s var(--ios-spring), opacity 0.26s ease;
    }

    .sidebar.chrome-collapsed .sidebar-bottom-pill {
      height: 24px;
      opacity: 1;
    }

    /* 메인 영역 */
    .main-container {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .topbar {
      margin: 12px 16px 0;
      padding: 10px 18px;
      border-radius: 20px;
      background: var(--glass-surface-strong);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04), var(--glass-specular);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .topbar-left { display: flex; align-items: center; min-width: 0; flex: 1; }
    .mobile-menu-btn { display: none; margin-right: 10px; font-weight: 600; }

    .breadcrumb {
      font-size: 0.84rem;
      color: var(--text-secondary);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-group { display: flex; gap: 7px; align-items: center; flex-shrink: 0; }

    .sync-badge {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--glass-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--glass-border-subtle);
      white-space: nowrap;
    }

    .btn-secondary {
      background: var(--glass-elevated);
      color: var(--text-primary);
      border: 1px solid var(--glass-border-subtle);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover { background: var(--glass-hover); }

    .btn-accent-outline {
      background: var(--glass-active);
      color: var(--accent);
      border: 1px solid rgba(0, 122, 255, 0.25);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-accent-outline:hover { background: var(--accent); color: #ffffff; }

    .btn-danger {
      background: rgba(255, 59, 48, 0.08);
      color: var(--danger);
      border: 1px solid rgba(255, 59, 48, 0.22);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 24px 36px;
    }

    /* 본문 리퀴드 글라스 카드 */
    .wiki-card {
      max-width: 860px;
      margin: 0 auto;
      background: var(--glass-surface-strong);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 38px 42px;
      box-shadow: var(--glass-shadow), var(--glass-specular);
    }

    .badge-row { display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
    .badge {
      display: inline-block;
      background: var(--glass-active);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0, 122, 255, 0.18);
    }
    .badge-sub {
      background: var(--glass-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--glass-border-subtle);
    }

    .article-title {
      font-size: 1.78rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: keep-all;
      letter-spacing: -0.025em;
    }

    .article-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--glass-border-subtle);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .tag-chip {
      background: var(--glass-elevated);
      border: 1px solid var(--glass-border-subtle);
      color: var(--text-secondary);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .article-body {
      font-size: 1rem;
      color: var(--text-primary);
      overflow-wrap: break-word;
      word-break: keep-all;
    }

    .article-body h2 {
      font-size: 1.28rem;
      font-weight: 700;
      margin: 26px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--glass-border-subtle);
      letter-spacing: -0.02em;
    }
    .article-body h3 { font-size: 1.08rem; font-weight: 700; margin: 18px 0 8px; color: var(--accent); }
    .article-body p { margin-bottom: 12px; }
    .article-body ul { margin: 8px 0 14px 20px; }
    .article-body li { margin-bottom: 7px; }

    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 4px;
      -webkit-overflow-scrolling: touch;
    }

    .callout {
      background: var(--callout-bg);
      border: 1px solid rgba(0, 122, 255, 0.16);
      border-left: 4px solid var(--callout-border);
      padding: 14px 18px;
      border-radius: 16px;
      margin: 16px 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .attached-images {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px dashed var(--glass-border-subtle);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .attached-img-box {
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      overflow: hidden;
      background: var(--glass-elevated);
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }
    .attached-img-box img { width: 100%; display: block; cursor: zoom-in; }
    .attached-img-caption {
      padding: 8px 12px; font-size: 0.78rem; color: var(--text-secondary);
      display: flex; justify-content: space-between; align-items: center;
    }

    /* 에디터 스타일 */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--glass-border-subtle);
      border-radius: 14px;
      background: var(--glass-elevated);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent);
      background: var(--glass-hover);
    }

    .editor-toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; padding: 8px;
      background: var(--glass-elevated); border: 1px solid var(--glass-border-subtle); border-radius: 16px;
    }

    .tool-btn {
      background: var(--glass-surface-strong);
      border: 1px solid var(--glass-border-subtle);
      color: var(--text-primary);
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }
    .tool-btn:hover { border-color: var(--accent); color: var(--accent); }

    .form-textarea {
      min-height: 320px; resize: vertical; line-height: 1.6;
      font-family: "SF Mono", "Consolas", "Pretendard", monospace;
    }

    .preview-box {
      margin-top: 12px; padding: 18px; border: 1px dashed var(--accent);
      border-radius: 18px; background: var(--glass-elevated); display: none;
    }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

    /* 모바일 하단 플로팅 독 (PC에서는 숨김) */
    .mobile-bottom-bar { display: none; }

    /* 글라스 모달 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 28, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;

    /* =========================================================================
       1. Web Crypto API 기반 AES-256-GCM 암호화 / 복호화 모듈
       ========================================================================= */
    async function deriveAesKey(masterId, masterPw, saltBytes) {
      const enc = new TextEncoder();
      const rawMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(`${masterId.trim()}::${masterPw}`),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: 150000,
          hash: "SHA-256"
        },
        rawMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptVaultPayload(masterId, masterPw, payloadObj) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveAesKey(masterId, masterPw, salt);
      const plainBytes = new TextEncoder().encode(JSON.stringify(payloadObj));
      const cipherBuffer = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plainBytes);
      const cipherBytes = new Uint8Array(cipherBuffer);

      const combined = new Uint8Array(salt.length + iv.length + cipherBytes.length);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(cipherBytes, salt.length + iv.length);

      let bin = "";
      for (let i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
      return btoa(bin);
    }

    async function decryptVaultPayload(masterId, masterPw, vaultBase64) {
      const bin = atob(vaultBase64.trim());
      const combined = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) combined[i] = bin.charCodeAt(i);

      const salt = combined.slice(0, 16);
      const iv = combined.slice(16, 28);
      const cipherBytes = combined.slice(28);

      const key = await deriveAesKey(masterId, masterPw, salt);
      const plainBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipherBytes);
      const plainText = new TextDecoder().decode(plainBuffer);
      return JSON.parse(plainText);
    }

    function getActiveVaultString() {
      if (ENCRYPTED_MASTER_VAULT && ENCRYPTED_MASTER_VAULT.trim().length > 20) {

    }

    /* =========================================================================
       2. 아이폰 감성 스크롤 방향 감지 축소/복원 컨트롤러
       ========================================================================= */
    function setupScrollCollapse(scrollEl, onScrollDown, onScrollUp) {
      let lastScrollTop = 0;
      let ticking = false;

      scrollEl.addEventListener("scroll", () => {
        if (!ticking) {
          window.requestAnimationFrame(() => {
            const currentTop = scrollEl.scrollTop;
            const delta = currentTop - lastScrollTop;

            if (currentTop <= 16) {
              onScrollUp();
            } else if (delta > 8) {
              onScrollDown();
            } else if (delta < -8) {
              onScrollUp();
            }

            lastScrollTop = currentTop;
            ticking = false;
          });
          ticking = true;
        }
      }, { passive: true });
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function base64ToUtf8(b64) {
      const clean = b64.replace(/\s/g, "");
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function getSubCategory(doc) {
      if (doc.subCategory && doc.subCategory.trim()) return doc.subCategory.trim();

    }

    async function loadFromGitHub() {
      try {
        syncBadgeEl.textContent = "불러오는 중...";
        if (ghConfig && ghConfig.token) {
          const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
          const res = await fetch(url, {
            headers: {
              "Authorization": `Bearer ${ghConfig.token}`,
              "Accept": "application/vnd.github+json"
            },
            cache: "no-store"
          });
          if (res.ok) {
            const data = await res.json();
            const parsed = JSON.parse(base64ToUtf8(data.content));
            if (Array.isArray(parsed)) {
              docs = parsed;
              saveToLocalStorage();
              syncBadgeEl.textContent = "✓ 최신 동기화";
              return true;
            }
          } else if (res.status === 404) {
            syncBadgeEl.textContent = "파일 신규 대기";
            return false;
          }
        } else {
          const res = await fetch(`./wiki_data.json?t=${Date.now()}`);
          if (res.ok) {
            const parsed = await res.json();
            if (Array.isArray(parsed) && parsed.length > 0) {
              docs = parsed;
              saveToLocalStorage();
              syncBadgeEl.textContent = "웹 데이터(읽기)";
              return true;
            }
          }
        }
      } catch (err) {
        console.warn("GitHub fetch skipped:", err);
      }
      updateAuthUI();
      return false;
    }

    async function pushToGitHub(commitMsg = "Update wiki_data.json via Web Wiki") {
      if (!ghConfig || !ghConfig.token) return;
      try {
        syncBadgeEl.textContent = "저장 중...";
        const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
        const headers = {
          "Authorization": `Bearer ${ghConfig.token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        };

        let sha = null;
        const getRes = await fetch(url, { headers, cache: "no-store" });
        if (getRes.ok) {
          const existing = await getRes.json();
          sha = existing.sha;
        }

        const bodyPayload = {
          message: commitMsg,
          content: utf8ToBase64(JSON.stringify(docs, null, 2))
        };
        if (sha) bodyPayload.sha = sha;

        const putRes = await fetch(url, {
          method: "PUT",
          headers,
          body: JSON.stringify(bodyPayload)
        });

        if (putRes.ok) {
          syncBadgeEl.textContent = "✓ GitHub 저장됨";
        } else {
          const errData = await putRes.json();
          alert(`GitHub 저장 실패: ${errData.message}`);
          syncBadgeEl.textContent = "⚠️ 저장 오류";
        }
      } catch (e) {
        alert("네트워크 오류로 GitHub 동기화에 실패했습니다. 로컬에는 저장되었습니다.");
        syncBadgeEl.textContent = "⚠️ 로컬저장됨";
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatContent(rawText) {
      if (!rawText) return "";
      const mathBlocks = [];

      let text = rawText.replace(/\$\$([\s\S]*?)\$\$/g, (match) => {
        mathBlocks.push(match);
        return `@@MATH_${mathBlocks.length - 1}@@`;
      });

      text = text.replace(/\$([^\$\n]+?)\$/g, (match) => {
        mathBlocks.push(match);
        return `@@MATH_${mathBlocks.length - 1}@@`;
      });

      text = escapeHtml(text);

      const lines = text.split("\n");
      let html = "";
      let inList = false;

      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith("- ")) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${applyInlineFormat(trimmed.slice(2))}</li>`;
          continue;
        } else if (inList) {
          html += "</ul>";
          inList = false;
        }

        if (trimmed.startsWith("### ")) {
          html += `<h3>${applyInlineFormat(trimmed.slice(4))}</h3>`;
        } else if (trimmed.startsWith("## ")) {
          html += `<h2>${applyInlineFormat(trimmed.slice(3))}</h2>`;
        } else if (trimmed.startsWith("&gt; ")) {
          html += `<div class="callout">${applyInlineFormat(trimmed.slice(5))}</div>`;
        } else if (trimmed === "") {
          html += "<div style='height:8px;'></div>";
        } else {
          html += `<p>${applyInlineFormat(line)}</p>`;
        }
      }

      if (inList) html += "</ul>";
      return html.replace(/@@MATH_(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);
    }

    function applyInlineFormat(str) {
      return str.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function renderMath(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    function refreshSubCategoryOptions() {
      const selectedCat = categoryFilterEl.value;
      const prevSub = subCategoryFilterEl.value;
      const subSet = new Set();

      docs.forEach((d) => {
        if (selectedCat === "ALL" || d.category === selectedCat) {
          subSet.add(getSubCategory(d));
        }
      });

      subCategoryFilterEl.innerHTML = `<option value="ALL">전체 세부단원</option>`;
      const datalist = document.getElementById("subCatSuggestions");
      datalist.innerHTML = "";

      Array.from(subSet).sort().forEach((sub) => {
        const opt = document.createElement("option");
        opt.value = sub;
        opt.textContent = sub;
        subCategoryFilterEl.appendChild(opt);

        const dOpt = document.createElement("option");
        dOpt.value = sub;
        datalist.appendChild(dOpt);
      });

      if (Array.from(subSet).includes(prevSub)) {
        subCategoryFilterEl.value = prevSub;
      } else {
        subCategoryFilterEl.value = "ALL";
      }
    }

      const filtered = docs.filter((doc) => {
        const docSub = getSubCategory(doc);
        const matchCat = cat === "ALL" || doc.category === cat;
        const matchSub = subCat === "ALL" || docSub === subCat;
        const matchKey =
          !keyword ||
          doc.title.toLowerCase().includes(keyword) ||
          doc.content.toLowerCase().includes(keyword) ||
          docSub.toLowerCase().includes(keyword) ||
          (doc.tags && doc.tags.some((t) => t.toLowerCase().includes(keyword)));
        return matchCat && matchSub && matchKey;
      });

        const idx = docs.findIndex((d) => d.id === editingDocId);
        if (idx !== -1) {
          docs[idx] = { ...docs[idx], title, category, subCategory, tags, content, images: tempImages, updatedAt: getNowString() };
          currentDocId = editingDocId;
        }
      } else {
        const newDoc = {
          id: "doc-" + Date.now(),
          title, category, subCategory, tags, content,
          images: tempImages,
          updatedAt: getNowString()
        };
        docs.unshift(newDoc);
        currentDocId = newDoc.id;
      }

      saveToLocalStorage();
      switchToView();
      refreshSubCategoryOptions();
      renderSidebar();
      renderView();
      await pushToGitHub(`Save doc: ${title}`);
    };

    /* =========================================================================
       4. 마스터키 로그인 & AES-256 금고 모달 이벤트
       ========================================================================= */
    const authModal = document.getElementById("authModal");
    const loginSection = document.getElementById("masterLoginSection");
    const setupSection = document.getElementById("masterSetupSection");
    const toggleSetupBtn = document.getElementById("toggleSetupModeBtn");

    function showLoginSection() {
      loginSection.style.display = "block";
      setupSection.style.display = "none";
      toggleSetupBtn.textContent = "⚙️ 새 금고 만들기";
      const vaultStr = getActiveVaultString();
      const badge = document.getElementById("vaultStatusBadge");
      if (vaultStr) {
        badge.textContent = "🛡️ AES-256 암호화 금고 준비됨";
        badge.style.color = "var(--success)";
      } else {
        badge.textContent = "⚠️ 등록된 금고 없음 (우측 '새 금고 만들기' 클릭)";
        badge.style.color = "var(--danger)";
      }
    }

    function showSetupSection() {
      loginSection.style.display = "none";
      setupSection.style.display = "block";
      toggleSetupBtn.textContent = "← 로그인 화면";
    }

    document.getElementById("openAuthModalBtn").onclick = () => {
      if (!getActiveVaultString()) {
        showSetupSection();
      } else {
        showLoginSection();
      }
      authModal.style.display = "flex";
    };

    toggleSetupBtn.onclick = () => {
      if (setupSection.style.display === "none") showSetupSection();
      else showLoginSection();
    };

    document.getElementById("backToLoginBtn").onclick = showLoginSection;
    document.getElementById("closeAuthModalBtn").onclick = () => { authModal.style.display = "none"; };

    // 마스터 아이디/비밀번호로 금고 복호화 및 로그인
    document.getElementById("unlockVaultBtn").onclick = async () => {
      const mId = document.getElementById("loginMasterId").value.trim();
      const mPw = document.getElementById("loginMasterPw").value;
      const vaultStr = getActiveVaultString();

      if (!vaultStr) {
        alert("먼저 우측 상단 [⚙️ 새 금고 만들기]를 눌러 마스터키 금고를 생성해 주세요.");
        return;
      }
      if (!mId || !mPw) {
        alert("마스터 아이디와 비밀번호를 입력해 주세요.");
        return;
      }

      try {
        const decrypted = await decryptVaultPayload(mId, mPw, vaultStr);
        if (!decrypted || !decrypted.token) throw new Error("Invalid payload");

        ghConfig = decrypted;
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(ghConfig));
        document.getElementById("loginMasterPw").value = "";
        updateAuthUI();
        authModal.style.display = "none";

        const loaded = await loadFromGitHub();
        if (!loaded && docs.length > 0) {
          await pushToGitHub("Initialize wiki_data.json");
        }
        if (docs.length > 0 && !currentDocId) currentDocId = docs[0].id;
        refreshSubCategoryOptions();
        renderSidebar();
        renderView();
        alert("마스터키 잠금 해제 완료! GitHub 동기화가 활성화되었습니다.");
      } catch (err) {
        alert("아이디 또는 비밀번호가 일치하지 않습니다.");
      }
    };

    // 새 암호화 금고 생성 및 즉시 연결
    document.getElementById("generateVaultBtn").onclick = async () => {
      const mId = document.getElementById("setupMasterId").value.trim();
      const mPw = document.getElementById("setupMasterPw").value;
      const owner = document.getElementById("ghOwner").value.trim();
      const repo = document.getElementById("ghRepo").value.trim().replace(/^https?:\/\/github\.com\/[^/]+\//i, "").replace(/\/+$/, "");
      const token = document.getElementById("ghToken").value.trim();

      if (!mId || !mPw || !owner || !repo || !token) {
        alert("새 마스터 아이디, 비밀번호, GitHub 저장소 정보, 토큰을 모두 입력해 주세요.");
        return;
      }

      const payload = { owner, repo, path: "wiki_data.json", token };
      const encryptedBase64 = await encryptVaultPayload(mId, mPw, payload);

      // 현재 기기 브라우저에도 암호화된 상태로 저장
      localStorage.setItem(LOCAL_VAULT_KEY, encryptedBase64);

      // 다른 기기(아이폰 17 등)에서도 쓰려면 index.html에 붙여넣을 수 있도록 표시
      const outBox = document.getElementById("generatedVaultBox");
      const outArea = document.getElementById("generatedVaultOutput");
      outBox.style.display = "block";
      outArea.value = encryptedBase64;
      outArea.select();

      // 즉시 세션 잠금 해제 및 연동
      ghConfig = payload;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(ghConfig));
      updateAuthUI();

      const loaded = await loadFromGitHub();
      if (!loaded && docs.length > 0) {
        await pushToGitHub("Initialize wiki_data.json");
      }
      refreshSubCategoryOptions();
      renderSidebar();
      renderView();
      alert("AES-256 암호화 금고가 생성되어 로그인되었습니다!\n\n아이폰 등 다른 기기에서도 이 아이디/비밀번호로 로그인하려면 화면에 표시된 암호화 문자열을 복사해 index.html의 ENCRYPTED_MASTER_VAULT에 넣어주세요.");
    };

    document.getElementById("ghLogoutBtn").onclick = () => {
      ghConfig = null;
      sessionStorage.removeItem(SESSION_KEY);
      updateAuthUI();
      authModal.style.display = "none";
      alert("위키가 잠금(읽기 전용) 상태로 전환되었습니다.");
    };

    document.getElementById("syncPullBtn").onclick = async () => {
      const ok = await loadFromGitHub();
      if (ok) {
        if (docs.length > 0 && !docs.some(d => d.id === currentDocId)) currentDocId = docs[0].id;
        refreshSubCategoryOptions();
        renderSidebar();
        renderView();
        closeSidebar();
      } else {
        alert("GitHub에서 불러올 wiki_data.json을 찾지 못했습니다.");
      }
    };

    document.querySelectorAll(".tool-btn[data-insert]").forEach((btn) => {
      btn.onclick = () => {
        const textarea = document.getElementById("editBody");
        const insertText = btn.getAttribute("data-insert");
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + insertText + textarea.value.substring(end);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + insertText.length;
      };
    });

    document.getElementById("togglePreviewBtn").onclick = () => {
      const preview = document.getElementById("livePreview");
      if (preview.style.display === "block") {
        preview.style.display = "none";
      } else {
        preview.style.display = "block";
        preview.innerHTML = formatContent(document.getElementById("editBody").value);
        renderMath(preview);
      }
    };

    document.getElementById("uploadImgBtn").onclick = () => document.getElementById("imgInput").click();

    document.getElementById("imgInput").onchange = (e) => {
      Array.from(e.target.files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 900;
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            tempImages.push({ name: file.name, data: canvas.toDataURL("image/jpeg", 0.78) });
            renderEditImages();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      e.target.value = "";
    };

    searchInputEl.oninput = renderSidebar;
    categoryFilterEl.onchange = () => { refreshSubCategoryOptions(); renderSidebar(); };
    subCategoryFilterEl.onchange = renderSidebar;

    document.getElementById("themeToggle").onclick = () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("wiki_theme", document.body.classList.contains("dark") ? "dark" : "light");
    };

    document.getElementById("mobileMenuBtn").onclick = openSidebar;

    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(docs, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `수학임용위키_통합백업_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById("mergeBtn").onclick = () => document.getElementById("mergeFileInput").click();
    document.getElementById("mergeFileInput").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error();
          let added = 0, updated = 0;
          imported.forEach((newDoc) => {
            if (!newDoc.id) newDoc.id = "doc-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
            const idx = docs.findIndex((d) => d.id === newDoc.id);
            if (idx !== -1) { docs[idx] = newDoc; updated++; }
            else { docs.push(newDoc); added++; }
          });
          saveToLocalStorage();
          if (imported.length > 0) currentDocId = imported[0].id;
          switchToView();
          refreshSubCategoryOptions();
          renderSidebar();
          renderView();
          closeSidebar();
          await pushToGitHub(`Merge ${added} added, ${updated} updated docs`);
          alert(`병합 완료! (신규 추가: ${added}개, 기존 갱신: ${updated}개)`);
        } catch (err) { alert("올바른 위키 JSON 파일이 아닙니다."); }
      };
      reader.readAsText(file);
      e.target.value = "";
    };

    document.getElementById("importBtn").onclick = () => document.getElementById("importFileInput").click();
    document.getElementById("importFileInput").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error();
          if (confirm(`총 ${imported.length}개 문서로 전체 덮어씁니다. 계속하시겠습니까?`)) {
            docs = imported;
            saveToLocalStorage();
            currentDocId = docs.length > 0 ? docs[0].id : null;
            switchToView();
            refreshSubCategoryOptions();
            renderSidebar();
            renderView();
            closeSidebar();
            await pushToGitHub(`Restore full backup (${docs.length} docs)`);
          }
        } catch (err) { alert("올바른 위키 백업 JSON 파일이 아닙니다."); }
      };
      reader.readAsText(file);
      e.target.value = "";
    };

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
