  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f1f5f9;
      --bg-active: #eef2ff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --callout-bg: #f8fafc;
      --callout-border: #4f46e5;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    body.dark {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --bg-active: #312e81;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-color: #334155;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --callout-bg: #0f172a;
      --callout-border: #6366f1;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
      line-height: 1.65;
    }

    /* 사이드바 */
    .sidebar {
      width: 310px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .btn-primary {
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .search-box {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input, .select-filter {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-main);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
    }

    .search-input:focus, .select-filter:focus {
      border-color: var(--accent);
    }

    .select-filter {
      margin-top: 8px;
    }

    .doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .doc-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }

    .doc-item:hover {
      background-color: var(--bg-hover);
    }

    .doc-item.active {
      background-color: var(--bg-active);
      border-color: var(--accent);
    }

    .doc-item-cat {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .doc-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-item-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .sidebar-footer .full-span {
      grid-column: span 2;
    }

    /* 메인 영역 */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 54px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .mobile-menu-btn {

      margin-right: 10px;
    }

    .breadcrumb {

      color: var(--text-secondary);
      font-weight: 500;
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {

      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;

    .btn-secondary:hover {

    .btn-accent-outline {

      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;

      color: var(--danger);

      font-size: 0.85rem;

      border-radius: 12px;

    /* 에디터 스타일 */

      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;

    .form-input, .form-select, .form-textarea {

      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;

    .form-input:focus, .form-select:focus, .form-textarea:focus {

    .editor-toolbar {

      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      padding: 8px;

      border: 1px solid var(--border-color);

    .modal {

      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;

    .modal img {

      max-height: 92vh;
      border-radius: 8px;

    @media (max-width: 768px) {

        position: fixed;
        top: 0;

        left: 0;

      }
      .mobile-menu-btn {
        display: inline-block;
      }
      .wiki-card {
        padding: 22px 18px;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
    }

  <script>
    const STORAGE_KEY = "math_imyong_wiki_docs_v1";

    const defaultDocs = [
      {
        id: "doc-1",
        title: "평등수렴(Uniform Convergence)과 연속성 보존 정리",
        category: "해석학",
        tags: ["함수열", "평등수렴", "필수증명"],
        updatedAt: "2026-11-12 16:00",
        images: [],
        content: `## 1. 정의 (평등수렴)
함수열 $\\{f_n\\}$이 집합 $E$ 위에서 함수 $f$로 **평등수렴**한다는 것은 임의의 $\\varepsilon > 0$에 대하여 자연수 $N$이 존재하여, 모든 $n \\ge N$과 **모든** $x \\in E$에 대해 다음이 성립함을 뜻한다.
$$
|f_n(x) - f(x)| < \\varepsilon
$$

## 2. 핵심 정리 (연속성의 보존)
> [정리] 함수열 $\\{f_n\\}$이 $E$ 위에서 $f$로 평등수렴하고, 각 $f_n$이 $x_0 \\in E$에서 연속이면 극한함수 $f$도 $x_0$에서 연속이다.`
      }
    ];

    let docs = [];
    let currentDocId = null;
    let editingDocId = null;
    let tempImages = [];

    const docListEl = document.getElementById("docList");
    const searchInputEl = document.getElementById("searchInput");
    const categoryFilterEl = document.getElementById("categoryFilter");
    const viewContainerEl = document.getElementById("viewContainer");
    const editContainerEl = document.getElementById("editContainer");
    const viewActionsEl = document.getElementById("viewActions");
    const breadcrumbEl = document.getElementById("breadcrumb");

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          docs = JSON.parse(saved);
        } catch (e) {
          docs = [...defaultDocs];
        }
      } else {
        docs = [...defaultDocs];
        saveToStorage();
      }

      if (localStorage.getItem("wiki_theme") === "dark") {
        document.body.classList.add("dark");
      }

      if (docs.length > 0) {
        currentDocId = docs[0].id;
      }
      renderSidebar();
      renderView();
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
      } catch (e) {
        alert("브라우저 저장 공간(LocalStorage) 용량이 부족합니다. JSON 백업 후 불필요한 이미지를 정리해 주세요.");
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatContent(rawText) {
      if (!rawText) return "";
      const mathBlocks = [];

      let text = rawText.replace(/\$\$([\s\S]*?)\$\$/g, (match) => {
        mathBlocks.push(match);
        return `@@MATH_${mathBlocks.length - 1}@@`;
      });

      text = text.replace(/\$([^\$\n]+?)\$/g, (match) => {
        mathBlocks.push(match);
        return `@@MATH_${mathBlocks.length - 1}@@`;
      });

      text = escapeHtml(text);

      const lines = text.split("\n");
      let html = "";
      let inList = false;

      for (let line of lines) {
        const trimmed = line.trim();

        if (trimmed.startsWith("- ")) {
          if (!inList) {
            html += "<ul>";
            inList = true;
          }
          html += `<li>${applyInlineFormat(trimmed.slice(2))}</li>`;
          continue;
        } else if (inList) {
          html += "</ul>";
          inList = false;
        }

        if (trimmed.startsWith("### ")) {
          html += `<h3>${applyInlineFormat(trimmed.slice(4))}</h3>`;
        } else if (trimmed.startsWith("## ")) {
          html += `<h2>${applyInlineFormat(trimmed.slice(3))}</h2>`;
        } else if (trimmed.startsWith("&gt; ")) {
          html += `<div class="callout">${applyInlineFormat(trimmed.slice(5))}</div>`;
        } else if (trimmed === "") {
          html += "<div style='height:8px;'></div>";
        } else {
          html += `<p>${applyInlineFormat(line)}</p>`;
        }
      }

      if (inList) html += "</ul>";

      html = html.replace(/@@MATH_(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);
      return html;
    }

    function applyInlineFormat(str) {
      return str.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function renderMath(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    function renderSidebar() {
      const keyword = searchInputEl.value.trim().toLowerCase();
      const cat = categoryFilterEl.value;

      const filtered = docs.filter((doc) => {
        const matchCat = cat === "ALL" || doc.category === cat;
        const matchKey =
          !keyword ||
          doc.title.toLowerCase().includes(keyword) ||
          doc.content.toLowerCase().includes(keyword) ||
          (doc.tags && doc.tags.some((t) => t.toLowerCase().includes(keyword)));
        return matchCat && matchKey;
      });

      docListEl.innerHTML = "";
      if (filtered.length === 0) {
        docListEl.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.85rem;">검색 결과가 없습니다.</div>`;
        return;
      }

      filtered.forEach((doc) => {
        const item = document.createElement("div");
        item.className = "doc-item" + (doc.id === currentDocId ? " active" : "");
        item.innerHTML = `
          <div class="doc-item-cat">${escapeHtml(doc.category)}</div>
          <div class="doc-item-title">${escapeHtml(doc.title)}</div>
          <div class="doc-item-meta">${escapeHtml(doc.updatedAt)}</div>
        `;
        item.onclick = () => {
          currentDocId = doc.id;
          switchToView();
          renderSidebar();
          renderView();
          document.getElementById("sidebar").classList.remove("open");
        };
        docListEl.appendChild(item);
      });
    }

    function renderView() {
      const doc = docs.find((d) => d.id === currentDocId);
      if (!doc) {
        viewActionsEl.style.display = "none";
        breadcrumbEl.textContent = "문서 없음";
        viewContainerEl.innerHTML = `
          <div class="empty-state">
            <h3>선택된 문서가 없습니다</h3>
            <p style="margin-top:8px;">좌측 상단의 <strong>[+ 새 정리 문서 작성]</strong> 버튼을 눌러 첫 문서를 만들어보세요.</p>
          </div>
        `;
        return;
      }

      viewActionsEl.style.display = "flex";
      breadcrumbEl.textContent = `${doc.category} / ${doc.title}`;

      const tagsHtml = (doc.tags || [])
        .map((t) => `<span class="tag-chip">#${escapeHtml(t)}</span>`)
        .join("");

      let imagesHtml = "";
      if (doc.images && doc.images.length > 0) {
        imagesHtml = `<div class="attached-images">` +
          doc.images.map((img, idx) => `
            <div class="attached-img-box">
              <img src="${img.data}" alt="${escapeHtml(img.name || '첨부이미지')}" onclick="openModal('${img.data}')" />
              <div class="attached-img-caption">
                <span>${escapeHtml(img.name || '참고 이미지 ' + (idx + 1))}</span>
              </div>
            </div>
          `).join("") +
        `</div>`;
      }

      viewContainerEl.innerHTML = `
        <span class="badge">${escapeHtml(doc.category)}</span>
        <h1 class="article-title">${escapeHtml(doc.title)}</h1>
        <div class="article-meta">
          <span>최종 수정: ${escapeHtml(doc.updatedAt)}</span>
          ${tagsHtml}
        </div>
        <div class="article-body" id="renderedBody">${formatContent(doc.content)}</div>
        ${imagesHtml}
      `;

      renderMath(document.getElementById("renderedBody"));
    }

    function switchToView() {
      editContainerEl.style.display = "none";
      viewContainerEl.style.display = "block";
    }

    function switchToEdit(doc = null) {
      viewContainerEl.style.display = "none";
      viewActionsEl.style.display = "none";
      editContainerEl.style.display = "block";
      document.getElementById("livePreview").style.display = "none";

      if (doc) {
        editingDocId = doc.id;
        breadcrumbEl.textContent = `문서 수정 중: ${doc.title}`;
        document.getElementById("editTitle").value = doc.title;
        document.getElementById("editCategory").value = doc.category;
        document.getElementById("editTags").value = (doc.tags || []).join(", ");
        document.getElementById("editBody").value = doc.content;
        tempImages = doc.images ? [...doc.images] : [];
      } else {
        editingDocId = null;
        breadcrumbEl.textContent = "새 정리 문서 작성";
        document.getElementById("editTitle").value = "";
        document.getElementById("editCategory").value = "해석학";
        document.getElementById("editTags").value = "";
        document.getElementById("editBody").value = "";
        tempImages = [];
      }
      renderEditImages();
    }

    function renderEditImages() {
      const container = document.getElementById("editImagesList");
      if (tempImages.length === 0) {
        container.innerHTML = "";
        return;
      }
      container.innerHTML = tempImages.map((img, idx) => `
        <div class="attached-img-box">
          <img src="${img.data}" alt="미리보기" />
          <div class="attached-img-caption">
            <span>${escapeHtml(img.name)}</span>
            <button type="button" class="btn-danger" style="padding:2px 6px; font-size:0.72rem;" onclick="removeTempImage(${idx})">삭제</button>
          </div>
        </div>
      `).join("");
    }

    window.removeTempImage = function(idx) {
      tempImages.splice(idx, 1);
      renderEditImages();
    };

    window.openModal = function(src) {
      document.getElementById("modalImg").src = src;
      document.getElementById("imgModal").style.display = "flex";
    };

    document.getElementById("imgModal").onclick = function() {
      this.style.display = "none";
    };

    function getNowString() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    document.getElementById("newDocBtn").onclick = () => {
      switchToEdit(null);
      document.getElementById("sidebar").classList.remove("open");
    };

    document.getElementById("editDocBtn").onclick = () => {
      const doc = docs.find((d) => d.id === currentDocId);
      if (doc) switchToEdit(doc);
    };

    document.getElementById("deleteDocBtn").onclick = () => {
      const doc = docs.find((d) => d.id === currentDocId);
      if (!doc) return;
      if (confirm(`'${doc.title}' 문서를 정말 삭제하시겠습니까?`)) {
        docs = docs.filter((d) => d.id !== currentDocId);
        saveToStorage();
        currentDocId = docs.length > 0 ? docs[0].id : null;
        renderSidebar();
        renderView();
      }
    };

    document.getElementById("cancelEditBtn").onclick = () => {
      switchToView();
      renderView();
    };

    document.getElementById("saveDocBtn").onclick = () => {
      const title = document.getElementById("editTitle").value.trim();
      const category = document.getElementById("editCategory").value;
      const tagsRaw = document.getElementById("editTags").value;
      const content = document.getElementById("editBody").value;

      if (!title) {
        alert("문서 제목을 입력해 주세요.");
        return;
      }

      const tags = tagsRaw
        .split(",")
        .map((t) => t.trim())
        .filter((t) => t.length > 0);

      if (editingDocId) {
        const idx = docs.findIndex((d) => d.id === editingDocId);
        if (idx !== -1) {
          docs[idx] = {
            ...docs[idx],
            title,
            category,
            tags,
            content,
            images: tempImages,
            updatedAt: getNowString()
          };
          currentDocId = editingDocId;
        }
      } else {
        const newDoc = {
          id: "doc-" + Date.now(),
          title,
          category,
          tags,
          content,
          images: tempImages,
          updatedAt: getNowString()
        };
        docs.unshift(newDoc);
        currentDocId = newDoc.id;
      }

      saveToStorage();
      switchToView();
      renderSidebar();
      renderView();
    };

    document.querySelectorAll(".tool-btn[data-insert]").forEach((btn) => {
      btn.onclick = () => {
        const textarea = document.getElementById("editBody");
        const insertText = btn.getAttribute("data-insert");
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + insertText + textarea.value.substring(end);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + insertText.length;
      };
    });

    document.getElementById("togglePreviewBtn").onclick = () => {
      const preview = document.getElementById("livePreview");
      if (preview.style.display === "block") {
        preview.style.display = "none";
      } else {
        preview.style.display = "block";
        preview.innerHTML = formatContent(document.getElementById("editBody").value);
        renderMath(preview);
      }
    };

    document.getElementById("uploadImgBtn").onclick = () => {
      document.getElementById("imgInput").click();
    };

    document.getElementById("imgInput").onchange = (e) => {
      const files = Array.from(e.target.files);
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 900;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            const compressed = canvas.toDataURL("image/jpeg", 0.78);
            tempImages.push({ name: file.name, data: compressed });
            renderEditImages();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      e.target.value = "";
    };

    searchInputEl.oninput = renderSidebar;
    categoryFilterEl.onchange = renderSidebar;

    document.getElementById("themeToggle").onclick = () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("wiki_theme", document.body.classList.contains("dark") ? "dark" : "light");
    };

    document.getElementById("mobileMenuBtn").onclick = () => {
      document.getElementById("sidebar").classList.toggle("open");
    };

    // JSON 전체 백업 저장
    document.getElementById("exportBtn").onclick = () => {
      const dataStr = JSON.stringify(docs, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `수학임용위키_통합백업_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    // [신규] 기존 문서 유지하며 JSON 문서 추가(병합)
    document.getElementById("mergeBtn").onclick = () => {
      document.getElementById("mergeFileInput").click();
    };

    document.getElementById("mergeFileInput").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error("형식 오류");

          let addedCount = 0;
          let updatedCount = 0;
          imported.forEach((newDoc) => {
            if (!newDoc.id) newDoc.id = "doc-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
            const existingIdx = docs.findIndex((d) => d.id === newDoc.id);
            if (existingIdx !== -1) {
              docs[existingIdx] = newDoc;
              updatedCount++;
            } else {
              docs.push(newDoc);
              addedCount++;
            }
          });

          saveToStorage();
          if (imported.length > 0) {
            currentDocId = imported[0].id;
          }
          switchToView();
          renderSidebar();
          renderView();
          alert(`기존 문서를 유지한 채 반영 완료! (신규 추가: ${addedCount}개, 기존 갱신: ${updatedCount}개)`);
        } catch (err) {
          alert("올바른 위키 JSON 파일이 아닙니다.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    };

    // JSON 전체 복원 (덮어쓰기)
    document.getElementById("importBtn").onclick = () => {
      document.getElementById("importFileInput").click();
    };

    document.getElementById("importFileInput").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error("형식 오류");
          if (confirm(`총 ${imported.length}개의 문서로 전체 덮어씁니다. 기존 데이터는 사라집니다. 계속하시겠습니까?`)) {
            docs = imported;
            saveToStorage();
            currentDocId = docs.length > 0 ? docs[0].id : null;
            switchToView();
            renderSidebar();
            renderView();
          }
        } catch (err) {
          alert("올바른 위키 백업 JSON 파일이 아닙니다.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    };

    window.addEventListener("DOMContentLoaded", init);
    window.addEventListener("load", () => {
      const bodyEl = document.getElementById("renderedBody");
      if (bodyEl) renderMath(bodyEl);
    });
  </script>
</body>
</html>
